[project]
name = "saaf-circuit-breaker"
version = "0.1.0"
description = "SAAF Circuit Breaker — containment pipeline for JET care refunds. Forge, MiroFish, Jev Sentinel, ISA 230 verify."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
saaf = "cli.main:app"
saaf-forge = "cli.main:forge_app"
saaf-rehearsal = "cli.main:rehearsal_app"
saaf-sentinel = "cli.main:sentinel_cli"
saaf-verify = "cli.main:verify_cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "forge*", "ledger*", "rehearsal*", "sentinel*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
