name: Deploy Pages

# Publishes docs/ to GitHub Pages. The site is fully static: the guard
# playground runs the shipped src/lib code, bundled ahead of time into
# docs/saaf-guard.js, so CI needs no Node build step.
#
# Rebuild the bundle after changing any src/lib policy module:
#   npm run pages:build

on:
  push:
    branches: [arena/378e58f3-agentcrash]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
