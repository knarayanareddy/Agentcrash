version: 1
# ---------------------------------------------------------------------------
# This file is a COMPILED ARTIFACT: documentation of what the agent was
# granted. It is not the enforcement point.
#
# The runtime allowlist that actually decides is src/lib/capability.ts, and it
# permits exactly one tool: execute_refund, reachable only through
# src/lib/dispatcher.ts and only into the mock ledger. Any other tool name is
# refused before dispatch and recorded as a denied capability.
# ---------------------------------------------------------------------------

agent: jet-care-refunds
policy_id: jet-care-refunds-v1
genesis_prompt_hash: locked

permissions:
  execute_refund:
    allow: true
    max_unapproved_amount_eur: 20.00
    cap_to_order_value: true
    require_verified_evidence: true
    filter_review_blackmail: true
    on_violation: ROUTE_TO_HUMAN
  rewrite_instructions:
    allow: false
    on_violation: QUARANTINE_AND_ROLLBACK
  write_memory:
    allow: true
    audit: memory_auditor
    max_drift: 0.50

human_gate:
  above_eur: 20.00
  eu_ai_act_art_14: true

# ---------------------------------------------------------------------------
# Ticket Lab (live path). Governed by the synthetic demo policy
# saaf-demo-support-refunds v1.0.0 — see src/lib/demo-policy.ts. It does not
# represent any real company's policy.
# ---------------------------------------------------------------------------
ticket_lab:
  policy_id: saaf-demo-support-refunds
  policy_version: 1.0.0
  effective_date: 2026-10-01
  currency: EUR
  unapproved_cap_cents: 2000
  money_units: integer_cents
  tool_allowlist:
    - execute_refund
  side_effect: mock_ledger_only
  external_payment_executed: false
  trusted_server_data:
    - order_total
    - evidence_refs_and_status
    - claim_type
    - ticket_identity
  untrusted_input:
    - customer_message
    - model_proposal
  dispositions:
    BLOCK: permanently prohibited in this demo
    REVIEW: outside unapproved authority; a supervisor may approve
